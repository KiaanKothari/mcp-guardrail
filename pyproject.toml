[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guardrail"
version = "0.1.0"
description = "An open-source policy gateway, audit log, and secret scanner for MCP (Model Context Protocol) servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kiaan Kothari" }
]
keywords = ["mcp", "model-context-protocol", "security", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mcp-guardrail = "mcp_guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
